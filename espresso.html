<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espresso how-to</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style id="app-style">:root{--bg:#F4F6F3;--surface:#E6EAE5;--ink:#1B211E;--muted:#58625C;--line:#CDD4CE;--on-a:#FFFFFF;--a:var(--accent-l,#3E6B4F);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131715;--surface:#1E2421;--ink:#EBEFEC;--muted:#9BA59F;--line:#343C38;--on-a:#131715;--a:var(--accent-d,#8CC4A0);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131715;--surface:#1E2421;--ink:#EBEFEC;--muted:#9BA59F;--line:#343C38;--on-a:#131715;--a:var(--accent-d,#8CC4A0);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.d{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:560px;margin:0 auto}
.top{padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
.bars{display:flex;gap:4px}
.bars i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .2s}
.bars i.on{background:var(--a)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;min-height:36px}
.row .t{font-weight:700;font-size:15px}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:22px;height:22px}
.deck{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.card{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
.media{margin:0 16px;min-height:0;border-radius:20px;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center}
.media img{width:100%;height:100%;object-fit:contain;display:block}
.caption{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding:20px 20px 6px;max-height:46dvh;overflow-y:auto}
.num{text-align:center;min-width:44px}
.num b{display:block;font-weight:800;font-size:60px;line-height:.85;color:var(--a);letter-spacing:-.03em}
.num small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.caption h2{font-size:25px;line-height:1.15;margin:2px 0 6px;font-weight:700}
.caption p{margin:0;font-size:17px;max-width:60ch;white-space:pre-line}
.solo{grid-row:1/-1;display:flex;flex-direction:column;justify-content:center;padding:24px 28px}
.solo .ic{width:92px;height:92px;color:var(--a);margin-bottom:28px}
.solo h1{font-weight:800;font-size:clamp(44px,13vw,70px);line-height:.95;letter-spacing:-.025em;margin:0 0 14px}
.solo h2{font-weight:800;font-size:clamp(34px,10vw,50px);line-height:1;letter-spacing:-.02em;margin:0 0 14px}
.solo p{font-size:18px;color:var(--muted);margin:0 0 8px;max-width:34ch;white-space:pre-line}
.solo .count{color:var(--ink);font-weight:600;margin-top:18px}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.btn{min-height:50px;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:16px}
.btn.primary{background:var(--a);color:var(--on-a);border-color:transparent}
.btn:disabled{opacity:.3;cursor:default}
.solo .btn{align-self:flex-start;margin-top:22px}
#pos{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;text-align:center;min-width:84px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.ed-host{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex}
.ed{display:flex;flex-direction:column;width:100%;max-width:680px;margin:0 auto;height:100%}
.ed-head,.ed-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ed-head{padding-top:calc(12px + env(safe-area-inset-top))}
.ed-head h2{margin:0;font-size:20px}
.ed-foot{border-top:1px solid var(--line);border-bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom));flex-wrap:wrap}
.ed-body{flex:1;overflow-y:auto;padding:4px 16px 32px}
.ed-body h3{font-size:18px;margin:28px 0 4px}
.hint{color:var(--muted);font-size:14px;margin:8px 0}
.ed label.f{display:block;font-size:14px;font-weight:600;margin:12px 0}
.ed input[type=text],.ed textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:16px/1.4 inherit;font-family:inherit}
.ed textarea{resize:vertical;min-height:84px}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.thumb{width:96px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--surface);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:6px;top:6px;background:var(--a);color:var(--on-a);font-weight:800;border-radius:8px;padding:0 7px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.sm{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:14px;font-weight:600;display:inline-flex;align-items:center}
.sm.danger{color:#B3261E;border-color:currentColor}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sm.danger{color:#F2B8B5}}
:root[data-theme="dark"] .sm.danger{color:#F2B8B5}
.sm input{position:absolute;width:1px;height:1px;opacity:0}
.sm:focus-within{outline:3px solid var(--a);outline-offset:2px}
.add{margin-top:16px;width:100%}
#edStatus{color:var(--muted);font-size:13px;flex:1 1 160px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="root"></div>
<!-- Tutorial content. Easiest to change by opening this page with #edit at the end of the address. -->
<script type="application/json" id="data">{
 "slug": "espresso",
 "icon": "espresso",
 "title": "Espresso",
 "subtitle": "De'Longhi COM530M, espresso side",
 "accent": {
  "light": "#8A4A26",
  "dark": "#E3A77F"
 },
 "steps": [
  {
   "title": "Check the water tank",
   "text": "Lift the lid and fill the tank to the MAX line.\nPush the tank down firmly until it seats. If it isn't pushed down, the pump gets loud and no espresso comes out.",
   "img": ""
  },
  {
   "title": "Turn it on to preheat",
   "text": "Press the Espresso ON/OFF button. The light flashes while it heats and goes steady when it's ready.\nLock the empty portafilter in and run a little water into your cup so both warm up. Cold cups make cold espresso.",
   "img": ""
  },
  {
   "title": "Fill the basket",
   "text": "Use the 1-cup basket for a single shot, the 2-cup basket for a double.\nOne level scoop of ground coffee (about 7 g) per shot. Knock out the old grounds before you refill.",
   "img": ""
  },
  {
   "title": "Tamp it level",
   "text": "Press the grounds down evenly with the flat end of the scoop.\nToo hard and it pours slowly and tastes bitter. Too light and it runs fast and tastes weak.",
   "img": ""
  },
  {
   "title": "Lock in the portafilter",
   "text": "Wipe loose grounds off the rim, slide the portafilter into the head, and turn the handle to the right as far as it goes.\nIf it isn't tight, coffee leaks around the edge instead of into your cup.",
   "img": ""
  },
  {
   "title": "Brew",
   "text": "Put your cup under the spouts and wait for the Espresso ON/OFF light to stop flashing.\nPress the espresso button to start, and press it again to stop when you have enough. Never pull the portafilter out while it's brewing.",
   "img": ""
  },
  {
   "title": "Knock out the puck",
   "text": "Turn the handle to the left to release the portafilter.\nFlip it over the trash and tap firmly to drop the puck out, then rinse the basket so it's clean for the next person.",
   "img": ""
  },
  {
   "title": "Empty the drip tray",
   "text": "Look at the cup tray. If the red float is poking up through it, the tray is full.\nSlide the tray out, dump it in the sink, and slide it back. Takes ten seconds and saves the next person from an overflow.",
   "img": ""
  }
 ],
 "outro": {
  "title": "Enjoy your espresso",
  "text": "Leave the machine clean for the next person.\nQuestions? Ask [name]."
 }
}</script>
<script id="app-script">(function () {
  "use strict";
  var HEAD_EXTRA = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">';
  var ICONS = {
    grinder: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M18 6h28l-6 16H24z"/><rect x="16" y="22" width="32" height="26" rx="4"/><circle cx="32" cy="35" r="5"/><path d="M22 48v6h20v-6M12 58h40"/></svg>',
    espresso: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M12 30h34v8a14 14 0 0 1-14 14h-6a14 14 0 0 1-14-14z"/><path d="M46 33h3a6 6 0 0 1 0 12h-5M8 58h44"/><path d="M22 22c-3-4 3-6 0-10M32 22c-3-4 3-6 0-10"/></svg>',
    drip: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M14 8h36l-10 14H24z"/><path d="M32 22v6"/><path d="M20 30h24l4 22a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4z"/><path d="M44 36h4a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-2"/><path d="M19 44h26"/></svg>'
  };
  var PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
  var CHECK = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M20 33l8 8 16-17"/></svg>';

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  var saved = JSON.parse(document.getElementById("data").textContent);
  var data = clone(saved);
  var editMode = /(^|[#&])edit\b/.test(location.hash);
  var DRAFT_KEY = "coffee-tutorial-draft-" + saved.slug;
  var MAX_MB = 25, WARN_MB = 15;
  var root = document.getElementById("root");
  var de = document.documentElement;
  de.style.setProperty("--accent-l", saved.accent.light);
  de.style.setProperty("--accent-d", saved.accent.dark);

  function placeholder(n) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">' +
      '<rect x="40" y="40" width="520" height="720" rx="32" fill="none" stroke="#8E9892" stroke-width="4" stroke-dasharray="18 14"/>' +
      '<g transform="translate(300 360)" fill="none" stroke="#8E9892" stroke-width="8" stroke-linejoin="round">' +
      '<rect x="-80" y="-50" width="160" height="110" rx="16"/><path d="M-36 -50l12 -22h48l12 22"/><circle cx="0" cy="5" r="30"/></g>' +
      '<text x="300" y="500" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" fill="#8E9892">Photo for step ' + n + '</text></svg>';
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  var deck, idx = 0, cardCount = 0;

  function render() {
    var steps = data.steps, total = steps.length;
    var cards = [];
    cards.push('<section class="card" aria-label="Start"><div class="solo">' +
      '<div class="ic">' + (ICONS[data.icon] || "") + "</div>" +
      '<h1 class="d">' + esc(data.title) + "</h1>" +
      "<p>" + esc(data.subtitle) + "</p>" +
      '<p class="count">' + total + " step" + (total === 1 ? "" : "s") + ". Swipe or tap Start.</p></div></section>");
    steps.forEach(function (s, i) {
      cards.push('<section class="card" aria-label="Step ' + (i + 1) + " of " + total + '">' +
        '<div class="media"><img src="' + esc(s.img || placeholder(i + 1)) + '" alt="' + esc(s.alt || s.title) + '"' + (i > 1 ? ' loading="lazy"' : "") + "></div>" +
        '<div class="caption"><div class="num d"><b>' + (i + 1) + "</b><small>of " + total + "</small></div>" +
        '<div><h2 class="d">' + esc(s.title) + "</h2><p>" + esc(s.text) + "</p></div></div></section>");
    });
    cards.push('<section class="card" aria-label="Finished"><div class="solo">' +
      '<div class="ic">' + CHECK + "</div>" +
      '<h2 class="d">' + esc(data.outro.title) + "</h2><p>" + esc(data.outro.text) + "</p>" +
      '<button class="btn" data-go="0">Start over</button></div></section>');
    cardCount = cards.length;
    var bars = "";
    for (var b = 0; b < cardCount; b++) bars += "<i></i>";
    root.innerHTML = '<div class="app">' +
      '<header class="top"><div class="bars" aria-hidden="true">' + bars + "</div>" +
      '<div class="row"><span class="t d">' + esc(data.title) + "</span>" +
      (editMode ? '<button class="icon-btn" id="editBtn" aria-label="Edit tutorial">' + PENCIL + "</button>" : "") +
      "</div></header>" +
      '<main class="deck" id="deck" tabindex="0" aria-roledescription="carousel">' + cards.join("") + "</main>" +
      '<nav class="controls"><button class="btn" id="prev">Back</button><span id="pos" aria-live="polite"></span><button class="btn primary" id="next">Start</button></nav>' +
      '</div><div class="toast" id="toast" role="status"></div><div id="edHost"></div>';
    deck = document.getElementById("deck");
    idx = Math.min(idx, cardCount - 1);
    deck.addEventListener("scroll", onScroll, { passive: true });
    document.getElementById("prev").onclick = function () { go(idx - 1); };
    document.getElementById("next").onclick = function () { go(idx + 1); };
    root.querySelectorAll("[data-go]").forEach(function (el) { el.onclick = function () { go(+el.dataset.go); }; });
    var eb = document.getElementById("editBtn");
    if (eb) eb.onclick = openEditor;
    requestAnimationFrame(function () { deck.scrollLeft = idx * deck.clientWidth; update(); });
  }

  var scrollT;
  function onScroll() {
    clearTimeout(scrollT);
    scrollT = setTimeout(function () {
      var i = Math.round(deck.scrollLeft / Math.max(1, deck.clientWidth));
      if (i !== idx) { idx = i; update(); }
    }, 60);
  }
  function go(i) {
    i = Math.max(0, Math.min(cardCount - 1, i));
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    deck.scrollTo({ left: i * deck.clientWidth, behavior: reduce ? "auto" : "smooth" });
    idx = i; update();
  }
  function update() {
    var n = data.steps.length;
    root.querySelectorAll(".bars i").forEach(function (el, i) { el.classList.toggle("on", i <= idx); });
    var pos = document.getElementById("pos");
    pos.textContent = idx === 0 ? "" : idx > n ? "Done" : "Step " + idx + " of " + n;
    document.getElementById("prev").disabled = idx === 0;
    var next = document.getElementById("next");
    next.disabled = idx >= cardCount - 1;
    next.textContent = idx === 0 ? "Start" : idx === n ? "Finish" : "Next";
  }
  document.addEventListener("keydown", function (e) {
    if (document.getElementById("edHost") && document.getElementById("edHost").firstChild) { editorKey(e); return; }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight") { e.preventDefault(); go(idx + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(idx - 1); }
  });
  window.addEventListener("resize", function () { if (deck) deck.scrollLeft = idx * deck.clientWidth; });

  /* ---------- Editor (open the page with #edit at the end of the address) ---------- */
  var draft = null, storageWarned = false;

  function toast(msg) {
    var t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 3200);
  }
  // The draft remembers which published version it was made from, so an old
  // draft never gets restored over a page that has since been updated.
  var baseHash;
  function base() {
    if (!baseHash) {
      var s = JSON.stringify(saved), h = 5381;
      for (var i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) | 0;
      baseHash = (h >>> 0).toString(36) + "-" + s.length;
    }
    return baseHash;
  }
  function persist() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ base: base(), draft: draft })); }
    catch (e) {
      // Drop the older backup so it can't be restored later in place of these edits.
      clearDraft();
      if (!storageWarned) { storageWarned = true; toast("Photos are too big to keep as a backup in this browser. Download the file before closing the page."); }
    }
  }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  function openEditor() {
    if (!draft) draft = clone(data);
    renderEditor();
    document.querySelector(".ed").focus();
  }
  function preview() {
    closeEditor(true);
    toast("Previewing your changes. Tap the pencil to keep editing.");
    var eb = document.getElementById("editBtn");
    if (eb) eb.focus();
  }
  // Escape previews; Tab stays inside the editor.
  function editorKey(e) {
    if (e.key === "Escape") { e.preventDefault(); preview(); return; }
    if (e.key !== "Tab") return;
    var ed = document.querySelector(".ed");
    var f = ed.querySelectorAll("button, input, textarea");
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1], a = document.activeElement;
    if (!ed.contains(a) || a === ed) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
    else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
  }
  function closeEditor(apply) {
    if (apply) { data = clone(draft); }
    document.getElementById("edHost").innerHTML = "";
    render();
  }
  function field(label, path, val, multi) {
    return '<label class="f">' + label + (multi
      ? '<textarea data-f="' + path + '" rows="3">' + esc(val) + "</textarea>"
      : '<input type="text" data-f="' + path + '" value="' + esc(val) + '">') + "</label>";
  }
  function renderEditor() {
    var host = document.getElementById("edHost");
    var prevScroll = host.querySelector(".ed-body") ? host.querySelector(".ed-body").scrollTop : 0;
    var items = draft.steps.map(function (s, i) {
      var last = i === draft.steps.length - 1;
      return "<li>" +
        '<div class="thumb"><img alt="" src="' + esc(s.img || placeholder(i + 1)) + '"><span>' + (i + 1) + "</span></div>" +
        "<div>" +
        '<div class="btns"><label class="sm">' + (s.img ? "Replace photo" : "Add photo or GIF") +
        '<input type="file" accept="image/*" data-photo="' + i + '"></label>' +
        (s.img ? '<button class="sm" data-act="rmphoto" data-i="' + i + '">Remove photo</button>' : "") + "</div>" +
        field("Step title", "steps." + i + ".title", s.title) +
        field("Instructions", "steps." + i + ".text", s.text, true) +
        '<div class="btns">' +
        (i > 0 ? '<button class="sm" data-act="up" data-i="' + i + '">Move up</button>' : "") +
        (!last ? '<button class="sm" data-act="down" data-i="' + i + '">Move down</button>' : "") +
        '<button class="sm danger" data-act="del" data-i="' + i + '">Delete step</button></div>' +
        "</div></li>";
    }).join("");
    host.innerHTML = '<div class="ed-host"><div class="ed" role="dialog" aria-modal="true" aria-label="Edit tutorial" tabindex="-1">' +
      '<div class="ed-head"><h2 class="d">Edit tutorial</h2><button class="sm" data-act="preview">Preview</button></div>' +
      '<div class="ed-body">' +
      '<p class="hint">Changes stay on this device until you download the updated file and upload it to your site under the same name (' + esc(draft.slug) + '.html).</p>' +
      field("Title", "title", draft.title) +
      field("Subtitle", "subtitle", draft.subtitle) +
      '<h3 class="d">Steps</h3><ol class="steps">' + items + "</ol>" +
      '<button class="btn add" data-act="add">Add step</button>' +
      '<h3 class="d">Last card</h3>' +
      field("Heading", "outro.title", draft.outro.title) +
      field("Message", "outro.text", draft.outro.text, true) +
      '<p class="hint" id="sizeNote"></p>' +
      '<button class="sm danger" data-act="discard">Discard unsaved changes</button>' +
      "</div>" +
      '<div class="ed-foot"><span id="edStatus"></span><button class="btn primary" data-act="download">Download updated file</button></div>' +
      "</div></div>";
    var body = host.querySelector(".ed-body");
    body.scrollTop = prevScroll;
    sizeNote();
    host.oninput = function (e) {
      var p = e.target.dataset.f;
      if (!p) return;
      var parts = p.split("."), o = draft;
      for (var k = 0; k < parts.length - 1; k++) o = o[parts[k]];
      o[parts[parts.length - 1]] = e.target.value;
      persist();
    };
    host.onchange = function (e) {
      if (e.target.dataset.photo != null) handlePhoto(e.target, +e.target.dataset.photo);
    };
    host.onclick = function (e) {
      var b = e.target.closest("[data-act]");
      if (!b) return;
      var i = +b.dataset.i, s = draft.steps, act = b.dataset.act;
      if (act === "up") { s.splice(i - 1, 0, s.splice(i, 1)[0]); }
      else if (act === "down") { s.splice(i + 1, 0, s.splice(i, 1)[0]); }
      else if (act === "del") { if (!confirm("Delete step " + (i + 1) + "?")) return; s.splice(i, 1); }
      else if (act === "rmphoto") { s[i].img = ""; }
      else if (act === "add") { s.push({ title: "New step", text: "", img: "" }); }
      else if (act === "preview") { preview(); return; }
      else if (act === "download") { download(); return; }
      else if (act === "discard") {
        if (!confirm("Discard all changes that haven't been downloaded?")) return;
        clearDraft(); draft = clone(saved); data = clone(saved);
      }
      persist(); renderEditor();
    };
  }

  function sizeNote() {
    var el = document.getElementById("sizeNote");
    if (!el) return;
    var mb = docMB(buildDoc(draft));
    el.textContent = "File size: " + mb.toFixed(1) + " MB" + (mb > MAX_MB ? ". Too big to upload: the limit is " + MAX_MB + " MB. Remove a photo or use a shorter GIF." :
      mb > WARN_MB ? ". Getting large and will load slowly on phones; try fewer or shorter GIFs." : ".");
  }
  function docMB(html) { return new Blob([html]).size / 1048576; }

  function status(msg) { var s = document.getElementById("edStatus"); if (s) s.textContent = msg; }

  function handlePhoto(input, i) {
    var file = input.files && input.files[0];
    if (!file) return;
    status("Processing photo…");
    if (file.type === "image/gif") {
      if (file.size > 6 * 1048576) { status("That GIF is over 6 MB. Use a shorter or smaller one."); return; }
      var r = new FileReader();
      r.onload = function () { draft.steps[i].img = r.result; persist(); renderEditor(); status("GIF added."); };
      r.onerror = function () { status("Couldn't read that file. Try another."); };
      r.readAsDataURL(file);
      return;
    }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 1400, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement("canvas");
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      var ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      draft.steps[i].img = c.toDataURL("image/jpeg", 0.82);
      persist(); renderEditor(); status("Photo added.");
    };
    img.onerror = function () { URL.revokeObjectURL(url); status("That image format isn't supported here. Try a JPEG or PNG (on iPhone, pick the photo from the Photos library)."); };
    img.src = url;
  }

  function buildDoc(s) {
    var css = document.getElementById("app-style").textContent;
    var js = document.getElementById("app-script").textContent;
    var json = JSON.stringify(s, null, 1).replace(/</g, "\\u003c");
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>" +
      esc(s.title) + " how-to</title>\n" + HEAD_EXTRA + "\n<style id=\"app-style\">" + css + "</style>\n</head>\n<body>\n<div id=\"root\"></div>\n" +
      "<!-" + "- Tutorial content. Easiest to change by opening this page with #edit at the end of the address. -->\n" +
      "<script type=\"application/json\" id=\"data\">" + json + "<\/script>\n<script id=\"app-script\">" + js + "<\/script>\n</body>\n</html>\n";
  }

  function download() {
    var html = buildDoc(draft);
    if (docMB(html) > MAX_MB && !confirm("This file is over " + MAX_MB + " MB, so GitHub and Cloudflare will reject it. Download anyway?")) return;
    var blob = new Blob([html], { type: "text/html" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = draft.slug + ".html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
    status("Downloaded " + draft.slug + ".html. Upload it to your site to replace the old one.");
  }

  // Restore an unsaved draft in edit mode, unless the published page changed since it was made
  function restoreDraft() {
    var stored = null, note = "";
    try { stored = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) {}
    if (!stored) return note;
    if (stored.steps) stored = { base: base(), draft: stored }; // backup saved by an older version of this page
    if (JSON.stringify(stored.draft) === JSON.stringify(saved)) return note; // already published
    if (stored.base !== base()) { clearDraft(); return "The page was updated since your last unsaved edits on this device, so those edits were set aside."; }
    draft = stored.draft; data = clone(draft);
    return "Restored your unsaved edits from this device.";
  }
  var restoreNote = editMode ? restoreDraft() : "";
  render();
  if (editMode) {
    if (restoreNote) toast(restoreNote);
    openEditor();
  }
  window.addEventListener("hashchange", function () {
    var m = /(^|[#&])edit\b/.test(location.hash);
    if (m === editMode) return;
    editMode = m;
    var note = "";
    if (m && !draft) note = restoreDraft();
    if (!m) data = clone(saved);
    render();
    if (m) { openEditor(); if (note) toast(note); }
  });
})();
</script>
</body>
</html>
